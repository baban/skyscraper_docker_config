# HTTP (80) & HTTPS (443) の両方を受け付ける設定
server {
    listen       80;
    listen       443 ssl;
    http2        on;
    server_name  babanba-n.mydns.jp localhost;

    # SSL 証明書設定
    ssl_certificate     /etc/letsencrypt/live/babanba-n.mydns.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/babanba-n.mydns.jp/privkey.pem;

    # 推奨 SSL プロトコル・セキュリティ設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Let's Encrypt 認証用パス (ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # リバースプロキシ共通ヘッダー（$scheme により HTTP / HTTPS を自動判別）
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    location ~ /(another|creation|css|file|img|moeditor|program|src|web_seminor|links|mad_achieve|mvm)/ {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        proxy_pass http://publify:3000/;
    }

    location /blog/ {
        proxy_pass http://publify:3000/;
    }

    location /wiki/ {
        proxy_pass http://mad-wiki-nginx/;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
